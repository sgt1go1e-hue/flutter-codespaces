name: Deploy app to GitHub Pages

# 配管アイソメ図アプリ(app/)をビルドして GitHub Pages に公開する。
# iPad の Safari から普通の https URL で開けるようにするため（Codespaces のポート
# 転送を経由しない）。作業ブランチへの push で自動更新。手動実行も可。

on:
  push:
    branches: ['claude/piping-isometric-pwa-jg1fi4']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中に新しい push が来たら古い方をキャンセル。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
